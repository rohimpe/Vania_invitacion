<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rumbo a Cornell ✈️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA: pedir nombre -->
  <section id="pantalla-nombre" class="pantalla activa">
    <div class="tarjeta-boarding">
      <p class="eyebrow">MISIÓN CORNELL 🎓</p>
      <p class="tagline-varsity">Cornell University · Est. 1865</p>
      <h1 class="titulo-principal">INGRESA TU NOMBRE</h1>
      <p class="subtexto">Supera 2 pruebas para que logre su sueño.</p>
      <input type="text" id="input-nombre" placeholder="Tu nombre" maxlength="20" autocomplete="off">
      <button id="btn-embarcar" class="btn-dorado">¡Cuenta conmigo!</button>
      <p class="error-nombre" id="error-nombre">Escribe tu nombre para continuar</p>
    </div>
  </section>

  <!-- PANTALLA: mapa principal -->
  <section id="pantalla-mapa" class="pantalla">
    <header class="encabezado-mapa">
      <p class="eyebrow">CAMINO DE VANIA A CORNELL...</p>
      <h1 class="titulo-mapa">Hola, <span id="nombre-jugadora">viajera</span> 👋</h1>
      <p class="subtexto">Completa cada escala para desbloquear la siguiente.</p>
    </header>

    <div class="mapa-vuelo">
      <svg class="ruta-svg" viewBox="0 0 380 260" preserveAspectRatio="none">
        <path id="ruta-punteada" d="M 101 231 C 140 170, 175 110, 221 53"
              fill="none" stroke="#B31B1B" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
      </svg>

      <img id="avion-viajero" class="avion" src="assets/imagenes/avion.png" alt="Avión">

      <!-- Nivel 1: Lima — Memoria -->
      <button class="sello sello-1" data-nivel="1" data-juego="juego2-memoria.html">
        <span class="sello-anillo">
          <span class="sello-icono">🇵🇪</span>
        </span>
        <span class="sello-estado" id="estado-1">Memoria</span>
      </button>

      <!-- Nivel 2: New York — Flappy -->
      <button class="sello sello-2 bloqueado" data-nivel="2" data-juego="juego3-flappy.html">
        <span class="sello-anillo">
          <span class="sello-icono">🗽</span>
          <span class="sello-candado">🔒</span>
        </span>
        <span class="sello-estado" id="estado-2">Flappy Bird</span>
      </button>
    </div>

    <footer class="pie-mapa">
      <p id="mensaje-progreso">Escala 1 de 2 — comienza en Lima</p>
    </footer>
  </section>

  <script src="musica.js"></script>
  <script src="progreso.js"></script>
  <script src="script.js"></script>
</body>
</html>
